  const SAMPLES = [{"body": "<span style='color:#111'>The entrance to Simbol Materials&#x27; Calipatria demonstration facility is seen on Wednesday, January 8, 2014 near a geothermal power plant by the Salton Sea. / Crystal Chatham, The Desert Sun\nWith an atomic number of 3, just behind hydrogen and helium, lithium is the lightest metal on earth, first isolated and identified in 1817 by Johan August Arfwedson, a Swedish chemist.\nIt\u2019s silvery white, soft and can store more energy than traditional metals used in batteries, which is why lithium-ion batteries have become a standard for consumer electronics and</span><span style='color:#1f77b4'></span><span style='color:#fff;background:#1f77b4;font-weight:bold;padding:0 3px;border-radius:3px;white-space:pre;' title='token id 2577'> clean</span><span style='color:#888'> energy technologies.\nIt\u2019s also highly unstable, which is why it\u2019 \u2026</span>", "label": "<b>label (32d):</b> <span style='color:#d62728'>-1</span> <span style='color:#1f77b4'>+1</span> <span style='color:#1f77b4'>+1</span> <span style='color:#1f77b4'>+1</span> <span style='color:#d62728'>-1</span> <span style='color:#1f77b4'>+1</span> <span style='color:#d62728'>-1</span> <span style='color:#d62728'>-1</span> <span style='color:#d62728'>-1</span> <span style='color:#1f77b4'>+1</span> <span style='color:#d62728'>-1</span> <span style='color:#1f77b4'>+1</span> <span style='color:#1f77b4'>+1</span> <span style='color:#d62728'>-1</span> <span style='color:#d62728'>-1</span> <span style='color:#1f77b4'>+1</span> <span style='color:#1f77b4'>+1</span> <span style='color:#1f77b4'>+1</span> <span style='color:#1f77b4'>+1</span> <span style='color:#1f77b4'>+1</span> <span style='color:#d62728'>-1</span> <span style='color:#1f77b4'>+1</span> <span style='color:#1f77b4'>+1</span> <span style='color:#d62728'>-1</span> <span style='color:#1f77b4'>+1</span> <span style='color:#1f77b4'>+1</span> <span style='color:#1f77b4'>+1</span> <span style='color:
