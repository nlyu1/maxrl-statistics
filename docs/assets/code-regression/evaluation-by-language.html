      const maxAbs = Math.max(...values.map((value) => Math.abs(value)));
      const limit = Math.max(0.05, maxAbs * 1.08);
      return [-limit, limit];
    }

    function differenceTraceForSort(sortBy, leftAlias, rightAlias) {
      const rows = sortedDifferenceRows(sortBy, leftAlias, rightAlias);
      const labels = rows.map((row) => labelForRow(row, sortBy));
      const values = rows.map((row) => differenceValue(row, leftAlias, rightAlias));
      return [{
        type: "bar",
        orientation: "h",
        name: `${leftAlias} - ${rightAlias}`,
        y: labels,
        x: values,
        text: values.map((value) => value === null ? null : value.toFixed(3)),
        textposition: "auto",
        marker: {
          color: values.map((value) => value === null
            ? "#9aa5b1"
            : (value >= 0 ? "#0f766e" : "#b42318")),
        },
        hovertemplate: (
          `<b>%{y}</b><br>${leftAlias} - ${rightAlias}: ` +
          "%{x:.4f}<extra></extra>"
        ),
      }];
    }

    function layoutForSort(sortBy) {
      const rows = sortedChartRows(sortBy);
      const labels = rows.map((row) => labelForRow(row, sortBy));
      const layout = JSON.parse(JSON.stringify(baseLayout));
      layout.yaxis.categoryarray = labels;
      return layout;
    }

    function layoutForDifference(sortBy, leftAlias, rightAlias) {
      const rows = sortedDifferenceRows(sortBy, leftAlias, rightAlias);
      const labels = rows.map((row) => labelForRow(row, sortBy));
      const layout = JSON.parse(JSON.stringify(baseLayout));
      layout.barmode = "relative";
      layout.showlegend = false;
      layout.title.text = (
        `Per-language Spearman Difference: ${leftAlias} - ${rightAlias}` +
        "<br><sup>Positive values mean the first selected method is higher.</sup>"
      );
      layout.xaxis.title = "Spearman difference";
      layout.xaxis.range = differenceXAxisRange(rows, leftAlias, rightAlias);
      layout.xaxis.zeroline = true;
      layout.xaxis.zerolinewidth = 2;
      layout.yaxis.categoryarray = labels;
      return layout;
    }

    function updateDifferenceChart() {
      const leftSelect = document.getElementById("difference-left-method");
      const rightSelect = document.getElementById("difference-right-method");
      const sortSelect = document.getElementById("difference-chart-sort");
      if (!leftSelect || !rightSelect || !sortSelect) {
        return;
      }
      Plotly.react(
        "difference-chart",
        differenceTraceForSort(sortSelect.value, leftSelect.value, rightSelect.value),
        layoutForDifference(sortSelect.value, leftSelect.value, rightSelect.value),
        { responsive: true },
      );
    }

    const sortSelect = document.getElementById("chart-sort");
    if (sortSelect) {
      sortSelect.value = initialSortBy;
      sortSelect.addEventListener("change", () => {
        Plotly.react("chart", tracesForSort(sortSelect.value), layoutForSort(sortSelect.value), {
          responsive: true,
        });
      });
    }
    Plotly.newPlot("chart", tracesForSort(initialSortBy), layoutForSort(initialSortBy), {
      responsive: true,
    });
    const differenceLeftSelect = document.getElementById("difference-left-method");
    const differenceRightSelect = document.getElementById("difference-right-method");
    const differenceSortSelect = document.getElementById("difference-chart-sort");
    if (differenceLeftSelect && differenceRightSelect && differenceSortSelect) {
      differenceLeftSelect.value = initialDifferenceLeftAlias;
      differenceRightSelect.value = initialDifferenceRightAlias;
      differenceSortSelect.value = initialSortBy;
      differenceLeftSelect.addEventListener("change", updateDifferenceChart);
      differenceRightSelect.addEventListener("change", updateDifferenceChart);
      differenceSortSelect.addEventListener("change", updateDifferenceChart);
      Plotly.newPlot(
        "difference-chart",
        differenceTraceForSort(initialSortBy, initialDifferenceLeftAlias, initialDifferenceRightAlias),
        layoutForDifference(initialSortBy, initialDifferenceLeftAlias, initialDifferenceRightAlias),
        { responsive: true },
      );
    }
  </script>
</body>

</html>
