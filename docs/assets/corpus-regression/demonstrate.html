<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corpus regression — sample browser</title>
<style>
  html, body {{ margin: 0; padding: 0; }}
  body {{
    font-family: Georgia, serif;
    font-size: 14px;
    line-height: 1.5;
    color: #111;
    padding: 12px 16px;
    box-sizing: border-box;
  }}
  .controls {{
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
  }}
  .group {{ display: flex; gap: 4px; align-items: center; }}
  .controls button {{
    width: 26px; height: 26px; padding: 0;
    font-size: 15px; line-height: 1;
    border: 1px solid #bbb; border-radius: 4px;
    background: #f5f5f5; cursor: pointer;
  }}
  .controls button:disabled {{ opacity: 0.4; cursor: default; }}
  .controls input[type=range] {{ width: 140px; }}
  .body {{
    white-space: pre-wrap;
    word-break: break-word;
  }}
  hr.sep {{ border: none; border-top: 1px solid #ddd; margin: 8px 0; }}
  .label {{ font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }}
</style>
</head>
<body>
  <div class="controls">
    <div class="group">
      <button id="prev">−</button>
      <button id="next">+</button>
      <span>sample <b id="cur">1</b> / <span id="total"></span></span>
    </div>
    <div class="group">
      <span>lookahead k =</span>
      <input id="kSlider" type="range" min="1" max="8" step="1" value="1">
      <span><b id="kCur">1</b> / 8</span>
    </div>
  </div>
  <div id="body" class="body"></div>
  <hr class="sep">
  <div id="label" class="label"></div>
